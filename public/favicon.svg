<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="-1 -3 30 30">
  <!-- The PaintMix logo mark: cyan, red, and yellow paint with multiplied overlaps. -->
  <defs>
    <clipPath id="cyan"><circle cx="8" cy="12" r="8"/></clipPath>
    <clipPath id="red"><circle cx="15" cy="8" r="8"/></clipPath>
    <clipPath id="yellow"><circle cx="20" cy="16" r="8"/></clipPath>
  </defs>
  <circle cx="8" cy="12" r="8" fill="#19B4E8"/>
  <circle cx="15" cy="8" r="8" fill="#E8363F"/>
  <circle cx="20" cy="16" r="8" fill="#FFD400"/>
  <circle cx="15" cy="8" r="8" fill="#172639" clip-path="url(#cyan)"/>
  <circle cx="20" cy="16" r="8" fill="#199600" clip-path="url(#cyan)"/>
  <circle cx="20" cy="16" r="8" fill="#E82D00" clip-path="url(#red)"/>
  <g clip-path="url(#cyan)">
    <circle cx="20" cy="16" r="8" fill="#172000" clip-path="url(#red)"/>
  </g>
</svg>
